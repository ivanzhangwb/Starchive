[package]
name = "starchive-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.89"

[dependencies]
anyhow.workspace = true
base64.workspace = true
directories.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tempfile = "3"
tokio.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Vendor libdbus without enabling the Secret Service backend's optional OpenSSL support.
dbus = { version = "0.9", features = ["vendored"] }
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }
