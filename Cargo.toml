[workspace]
members = ["core", "cli", "desktop"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
tokio = { version = "1", features = ["full"] }
starchive-core = { path = "core" }

[profile.release.package.sqlx-macros]
# Preserve the proc macro's Mach-O string-table alignment on newer macOS toolchains.
strip = false
